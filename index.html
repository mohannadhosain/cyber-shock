<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b11">
  <meta name="description" content="CYBER SHOCK — بوابة تفاعلية للتوعية بالأمن السيبراني">
  <title>CYBER SHOCK | Security Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <div class="ambient" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <header class="site-header">
      <div class="brand" dir="ltr"><span class="brand-mark">⬡</span> CYBER<span class="brand-light">SHOCK</span><span class="brand-ver">/03</span></div>
      <div class="header-status" id="headerStatus"><span class="status-dot"></span><span id="headerText">SECURE CHANNEL</span></div>
    </header>
    <div class="progress-top"><div id="globalProgress"></div></div>
    <section class="stage" id="stage" aria-live="polite">
      <div class="panel intro enter" data-scene="intro">
        <div class="intro-icon"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 8 84 22v26c0 24-14 37-34 46C30 85 16 72 16 48V22L50 8Z" stroke="currentColor" stroke-width="3"/><path d="m33 49 12 12 24-25" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="eyebrow">SECURE VERIFICATION PORTAL</div>
        <h1>بوابة التحقق الأمني</h1>
        <p class="intro-lead">فحص الجلسة والتحقق من سلامة الاتصال</p>
        <div class="intro-meta"><div><span>حالة الاتصال</span><b>جاهز للفحص</b></div><div><span>نوع الفحص</span><b>سلامة الجلسة</b></div><div><span>الإصدار</span><b>3.0.26</b></div></div>
        <div class="consent"><label><input id="agree" type="checkbox"><span>أوافق على المشاركة في نشاط توعوي يتضمن مفاجآت ومؤثرات بصرية وتنبيهات صوتية اختيارية. لا يجري الوصول إلى بيانات هاتفي، ويمكنني إنهاء النشاط في أي وقت.</span></label></div>
        <button class="primary" id="startBtn" disabled>بدء التحقق <span>←</span></button>
        <p class="small-print">لا حاجة لتثبيت أي تطبيق أو منح أي صلاحيات.</p>
      </div>
    </section>
    <footer class="site-footer"><span id="footerLeft">ENCRYPTED SESSION UI</span><span id="footerRight">© 2026 CYBER SHOCK</span></footer>
    <button class="exit" id="exitBtn" aria-label="إنهاء النشاط وعرض التوضيح" title="إنهاء النشاط" hidden>إنهاء النشاط <span>×</span></button>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
